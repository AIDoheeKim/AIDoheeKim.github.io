e="Change theme"> <i class="ti ti-sun-moon" id="light-toggle-system"></i> <i class="ti ti-moon-filled" id="light-toggle-dark"></i> <i class="ti ti-sun-filled" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> <progress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">GALLERY</h1> <p class="post-description"></p> </header> <article> <style>.gallery-wrap{max-width:1100px;margin:0 auto}.gallery-title{text-align:center;font-size:2.2rem;font-weight:800;color:#111827;margin:2rem 0 3rem}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}.gallery-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.07);cursor:pointer}.gallery-card:hover{transform:translateY(-3px);transition:.2s}.gallery-image{width:100%;height:210px;object-fit:cover;object-position:center;display:block;background:#f3f4f6}.gallery-info{padding:1rem}.gallery-name{font-size:1rem;font-weight:700;color:#111827;margin-bottom:.5rem}.gallery-date{display:inline-block;font-size:.78rem;font-weight:700;color:#374151;background:#f3f4f6;padding:.22rem .55rem;border-radius:999px;margin-bottom:.55rem}.gallery-tag{display:inline-block;font-size:.72rem;font-weight:600;color:#1d4ed8;background:#dbeafe;padding:.25rem .55rem;border-radius:999px;margin-bottom:.7rem}.gallery-desc{font-size:.82rem;color:#4b5563;line-height:1.5}.gallery-modal{display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,0.65);align-items:center;justify-content:center;padding:2rem}.gallery-modal.open{display:flex}.gallery-modal-box{background:#fff;width:min(900px,95vw);max-height:90vh;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.25)}.gallery-modal-image-wrap{position:relative;background:#f3f4f6;text-align:center}.gallery-modal-image{max-width:100%;max-height:520px;object-fit:contain;display:block;margin:0 auto}.gallery-close{position:absolute;top:12px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:#fff;font-size:1.2rem;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,0.15)}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#fff;cursor:pointer;font-size:1.4rem;box-shadow:0 2px 8px rgba(0,0,0,0.18)}.gallery-arrow.left{left:14px}.gallery-arrow.right{right:14px}.gallery-count{position:absolute;right:14px;bottom:12px;background:#fff;color:#111827;font-size:.75rem;padding:.25rem .55rem;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,0.15)}.gallery-modal-info{padding:1.4rem}.gallery-modal-title{font-size:1.45rem;font-weight:800;color:#111827;margin-bottom:.4rem}.gallery-modal-date{font-size:.85rem;color:#6b7280;margin-bottom:1rem}.gallery-modal-label{font-size:.75rem;font-weight:800;color:#059669;margin-top:1rem;margin-bottom:.3rem;text-transform:uppercase}.gallery-thumbs{display:flex;gap:.5rem;margin-top:.8rem}.gallery-thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}.gallery-thumb.active{border-color:#1d4ed8}@media(max-width:900px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.gallery-grid{grid-template-columns:1fr}.gallery-title{font-size:1.8rem}}</style> <div class="gallery-wrap"> <div class="gallery-title">GALLERY</div> <div class="gallery-grid" id="galleryGrid"></div> </div> <div class="gallery-modal" id="galleryModal"> <div class="gallery-modal-box"> <button class="gallery-close" onclick="closeGallery()">×</button> <div class="gallery-modal-image-wrap"> <button class="gallery-arrow left" onclick="prevImage()">‹</button> <img class="gallery-modal-image" id="modalImage" src="" alt=""> <button class="gallery-arrow right" onclick="nextImage()">›</button> <div class="gallery-count" id="imageCount"></div> </div> <div class="gallery-modal-info"> <div class="gallery-modal-title" id="modalTitle"></div> <div class="gallery-modal-date" id="modalDate"></div> <div class="gallery-modal-label">Description</div> <div id="modalDesc"></div> <div class="gallery-modal-label">Location</div> <div id="modalLocation"></div> <div class="gallery-modal-label">Images</div> <div class="gallery-thumbs" id="modalThumbs"></div> </div> </div> </div> <script>
const galleries = [
  {
    title: "2026 Teacher's Day",
    date: "May 15, 2026",
    sortDate: "2026-05-15",
    location: "Changwon National University",
    tag: "Lab Events",
    desc: "김도희교수님 항상 감사합니다!",
    images: [
      "/assets/img/gallery/teachersday_2026_1.jpg",
      "/assets/img/gallery/teachersday_2026_2.jpg"
    ]
  },
  {
    title: "2026 Cherry Blossom",
    date: "April 3, 2026",
    sortDate: "2026-04-03",
    location: "Changwon National University",
    tag: "Lab Events",
    desc: "DOLab members enjoyed the cherry blossoms together.",
    images: [
      "/assets/img/gallery/cherry_2026_1.jpg",
      "/assets/img/gallery/cherry_2026_2.jpg",
      "/assets/img/gallery/cherry_2026_3.jpg",
      "/assets/img/gallery/cherry_2026_4.jpg",
      "/assets/img/gallery/cherry_2026_5.jpg"
    ]
  }
];

galleries.sort(function(a, b) {
  return new Date(b.sortDate) - new Date(a.sortDate);
});

const galleryGrid = document.getElementById("galleryGrid");

galleries.forEach(function(gallery, index) {
  const card = document.createElement("div");
  card.className = "gallery-card";
  card.onclick = function() {
    openGallery(index);
  };

  card.innerHTML = `
    <img class="gallery-image" src="${gallery.images[0]}" alt="${gallery.title}">
    <div class="gallery-info">
      <div class="gallery-name">${gallery.title}</div>
      <div class="gallery-date">${gallery.date}</div>
      <br>
      <div class="gallery-tag">${gallery.tag}</div>
      <div class="gallery-desc">${gallery.desc}</div>
    </div>
  `;

  galleryGrid.appendChild(card);
});

let currentGallery = 0;
let currentImage = 0;

function openGallery(index) {
  currentGallery = index;
  currentImage = 0;
  document.getElementById("galleryModal").classList.add("open");
  renderGallery();
}

function closeGallery() {
  document.getElementById("galleryModal").classList.remove("open");
}

function renderGallery() {
  const gallery = galleries[currentGallery];

  document.getElementById("modalTitle").innerText = gallery.title;
  document.getElementById("modalDate").innerText = gallery.date;
  document.getElementById("modalDesc").innerText = gallery.desc;
  document.getElementById("modalLocation").innerText = gallery.location;
  document.getElementById("modalImage").src = gallery.images[currentImage];
  document.getElementById("imageCount").innerText = (currentImage + 1) + " / " + gallery.images.length;

  const thumbs = document.getElementById("modalThumbs");
  thumbs.innerHTML = "";

  gallery.images.forEach(function (src, i) {
    const img = document.createElement("img");
    img.src = src;
    img.className = "gallery-thumb" + (i === currentImage ? " active" : "");
    img.onclick = function () {
      currentImage = i;
      renderGallery();
    };
    thumbs.appendChild(img);
  });
}

function nextImage() {
  const gallery = galleries[currentGallery];
  currentImage = (currentImage + 1) % gallery.images.length;
  renderGallery();
}

function prevImage() {
  const gallery = galleries[currentGallery];
  currentImage = (currentImage - 1 + gallery.images.length) % gallery.images.length;
  renderGallery();
}

document.addEventListener("keydown", function(e) {
  const modal = document.getElementById("galleryModal");
  if (!modal.classList.contains("open")) return;

  if (e.key === "Escape") closeGallery();
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
});
</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Dohee Kim. <a href="https://www.changwon.ac.kr/ai/main.do" rel="external nofollow noopener" target="_blank"> Department of Artificial Intelligence Convergence Engineering, Changwon National University</a>. Powered by <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a>. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?c15de51d4bb57887caa2c21988d97279"></script> <script defer src="/assets/js/copy_code.js?c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/assets/js/mathjax-setup.js?a5bb4e6a542c546dd929b24b8b236dfd"></script> <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6" crossorigin="anonymous"></script> <script defer src="/assets/js/progress-bar.js?2f30e0e6801ea8f5036fa66e1ab0a71a" type="text/javascript"></script> <script src="/assets/js/vanilla-back-to-top.min.js?f40d453793ff4f64e238e420181a1d17"></script> <script>
