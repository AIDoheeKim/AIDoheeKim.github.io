t);margin-bottom:.4rem}.gallery-modal-date{font-size:.85rem;color:var(--gallery-text-muted);margin-bottom:1rem}.gallery-modal-label{font-size:.75rem;font-weight:800;color:var(--gallery-label);margin-top:1rem;margin-bottom:.3rem;text-transform:uppercase}.gallery-thumbs{display:flex;gap:.5rem;margin-top:.8rem}.gallery-thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;background:var(--gallery-surface-muted)}.gallery-thumb.active{border-color:var(--gallery-accent)}@media(max-width:900px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.gallery-grid{grid-template-columns:1fr}.gallery-title{font-size:1.8rem}}</style> <div class="gallery-wrap"> <div class="gallery-grid" id="galleryGrid"></div> </div> <div class="gallery-modal" id="galleryModal"> <div class="gallery-modal-box"> <button class="gallery-close" onclick="closeGallery()">×</button> <div class="gallery-modal-image-wrap"> <button class="gallery-arrow left" onclick="prevImage()">‹</button> <img class="gallery-modal-image" id="modalImage"> <button class="gallery-arrow right" onclick="nextImage()">›</button> <div class="gallery-count" id="imageCount"></div> </div> <div class="gallery-modal-info"> <div class="gallery-modal-title" id="modalTitle"></div> <div class="gallery-modal-date" id="modalDate"></div> <div class="gallery-modal-label">Description</div> <div id="modalDesc"></div> <div class="gallery-modal-label">Location</div> <div id="modalLocation"></div> <div class="gallery-modal-label">Images</div> <div class="gallery-thumbs" id="modalThumbs"></div> </div> </div> </div> <script>
const galleries = [{"slug":"ieee-case-2026","title":"IEEE CASE 2026","date":"August 19–21, 2026","sortDate":"2026-08-19","location":"Shenyang, China","tag":"Conference","desc":"DOLab participated in IEEE CASE 2026 in Shenyang, China.","images":["/assets/img/gallery/ieee_case_2026_1.jpg","/assets/img/gallery/ieee_case_2026_2.jpg","/assets/img/gallery/ieee_case_2026_3.jpg","/assets/img/gallery/ieee_case_2026_4.jpg","/assets/img/gallery/ieee_case_2026_5.jpg","/assets/img/gallery/ieee_case_2026_6.jpg","/assets/img/gallery/ieee_case_2026_7.jpg"]},{"slug":"lg-electronics-executive-visit","title":"LG Electronics Executive Visit","date":"June 12, 2026","sortDate":"2026-06-12","location":"Changwon National University","tag":"Lab Events","desc":"LG Electronics executives visited DOLab.","images":["/assets/img/gallery/lg.jpg","/assets/img/gallery/lg1.jpg","/assets/img/gallery/lg2.jpg","/assets/img/gallery/lg3.jpg"]},{"slug":"2026-spring-joint-conference-industrial-engineering","title":"2026 Spring Joint Conference (Industrial Engineering)","date":"June 4, 2026","sortDate":"2026-06-04","location":"Gyeongju HICO","tag":"Conference","desc":"산업공학회 춘계공동학술대회 참가 및 발표.","images":["/assets/img/gallery/ie_spring_2026_1.jpg","/assets/img/gallery/ie_spring_2026_2.jpg","/assets/img/gallery/ie_spring_2026_3.jpg","/assets/img/gallery/ie_spring_2026_4.jpg"]},{"slug":"2026-teachers-day","title":"2026 Teacher's Day","date":"May 15, 2026","sortDate":"2026-05-15","location":"Changwon National University","tag":"Lab Events","desc":"김도희교수님 항상 감사합니다!","images":["/assets/img/gallery/teachersday_2026_1.jpg","/assets/img/gallery/teachersday_2026_2.jpg"]},{"slug":"2026-cherry-blossom","title":"2026 Cherry Blossom","date":"April 3, 2026","sortDate":"2026-04-03","location":"Changwon National University","tag":"Lab Events","desc":"DOLab's first seminar and cherry blossom.","images":["/assets/img/gallery/cherry_2026_1.jpg","/assets/img/gallery/cherry_2026_2.jpg","/assets/img/gallery/cherry_2026_3.jpg","/assets/img/gallery/cherry_2026_4.jpg","/assets/img/gallery/cherry_2026_5.jpg"]}];

galleries.sort((a, b) => new Date(b.sortDate) - new Date(a.sortDate));

const grid = document.getElementById("galleryGrid");

let currentGallery = 0;
let currentImage = 0;

function renderGrid() {
  grid.innerHTML = "";

  galleries.forEach((g, i) => {
    const card = document.createElement("div");
    card.className = "gallery-card";
    card.onclick = () => openGallery(i);

    card.innerHTML = `
      <img class="gallery-image" src="${g.images[0]}" alt="${g.title}">
      <div class="gallery-info">
        <div class="gallery-name">${g.title}</div>
        <div class="gallery-date">${g.date}</div>
        <div class="gallery-tag">${g.tag}</div>
        <div class="gallery-desc">${g.desc}</div>
      </div>
    `;

    grid.appendChild(card);
  });
}

function openGallery(i) {
  currentGallery = i;
  currentImage = 0;
  const url = new URL(window.location);
  url.searchParams.set("gallery", galleries[i].slug);
  window.history.replaceState({}, "", url);
  document.getElementById("galleryModal").classList.add("open");
  renderGallery();
}

function closeGallery() {
  const url = new URL(window.location);
  url.searchParams.delete("gallery");
  window.history.replaceState({}, "", url);
  document.getElementById("galleryModal").classList.remove("open");
}

function renderGallery() {
  const g = galleries[currentGallery];

  document.getElementById("modalTitle").innerText = g.title;
  document.getElementById("modalDate").innerText = g.date;
  document.getElementById("modalDesc").innerText = g.desc;
  document.getElementById("modalLocation").innerText = g.location;
  document.getElementById("modalImage").src = g.images[currentImage];
  document.getElementById("imageCount").innerText = (currentImage + 1) + " / " + g.images.length;

  const thumbs = document.getElementById("modalThumbs");
  thumbs.innerHTML = "";

  g.images.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src;
    img.className = "gallery-thumb" + (i === currentImage ? " active" : "");
    img.onclick = () => {
      currentImage = i;
      renderGallery();
    };
    thumbs.appendChild(img);
  });
}

function nextImage() {
  const g = galleries[currentGallery];
  currentImage = (currentImage + 1) % g.images.length;
  renderGallery();
}

function prevImage() {
  const g = galleries[currentGallery];
  currentImage = (currentImage - 1 + g.images.length) % g.images.length;
  renderGallery();
}

document.addEventListener("keydown", (e) => {
  const modal = document.getElementById("galleryModal");
  if (!modal.classList.contains("open")) return;

  if (e.key === "Escape") closeGallery();
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
});

renderGrid();

const initialGallery = new URLSearchParams(window.location.search).get("gallery");
if (initialGallery) {
  const initialIndex = galleries.findIndex((g) => g.slug === initialGallery);
  if (initialIndex >= 0) openGallery(initialIndex);
}

"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/assets/js/mathjax-setup.js?a5bb4e6a542c546dd929b24b8b236dfd"></script> <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6" crossorigin="anonymous"></script> <script defer src="/assets/js/progress-bar.js?2f30e0e6801ea8f5036fa66e1ab0a71a" type="text/javascript"></script> <script src="/assets/js/vanilla-back-to-top.min.js?f40d453793ff4f64e238e420181a1d17"></script> <script>
